<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        header {
        font-family: var(--font-family);
        height: var(--header-height);
        h1 {
          background: url('./resources/Assets/Logo/continuousgood-logo.png') no-repeat left center;
          background-size: contain;
          width: 30%;
          height: 100%;
          line-height: var(--header-height);
          margin: 0;
        }
        nav ul {
          display: flex;
          flex-direction: row;
          justify-content: flex-end;
        }
        nav ul li {
          list-style: none;
        }
        nav ul li a {
          font-size: 16px;
          font-weight: 700;
          color: var(--gray);
          text-transform: uppercase;
          text-decoration: none;
          padding: 10px 15px;
        }
        nav ul li a:hover {
          color: var(--white);
          background-color: var(--primary-color);
          clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }
        /* Flexbox header styles */
        #header-flex {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 20px;
        }
        #header-flex nav {
          display: inline-flex;
          justify-content: flex-end;
          width: 70%;
        }
        /* Responsive adjustments for header-flex */
        @media (max-width: 1020px) {
          #header-flex {
            padding: 0 15px;
          }
        }
        @media (max-width: 920px) {
          #header-flex {
            padding: 0 0 0 10px;
            flex-direction: row;
            justify-content: space-between;
            height: 145px;
          }
          #header-flex #logo-flex {
            width: 70%;
          }
          #header-flex nav {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            max-width: 30%;
            background-color: #007BFF;
            height: 145px;
            margin-left: 10px;
          }
          .menu-icon {
            display: flex;
            font-size: 24px;
            letter-spacing: 2px;
            justify-content: center;
            padding: 0 20px;
            align-items: center;
            text-transform: uppercase;
            cursor: pointer;
            color: #FFFFFF;
            font-weight: 700;
            width: -webkit-fill-available;
          }
          .hamburger-icon {
            background: url('./resources/Assets/PNG Icon/hamburger-menu.png') no-repeat center;
            background-size: contain;
            min-width: 35px;
            min-height: 35px;
            display: inline-block;
            margin-left: 20px;
          }
          #main-menu-flex {
            display: none;
            flex-direction: column;
            position: absolute;
            top: 145px;
            left: 0;
            width: 100%;
            background-color: #007BFF;
            z-index: 999;
          }
          #main-menu-flex li a {
            font-size: 28px;
            letter-spacing: 1px;
            display: block;
            color: #FFFFFF;
            line-height: 50px;
            padding: 20px 0 20px 20px;
          }
          #main-menu-flex li a:hover {
            width: 100%;
            color: #FFFFFF;
            background-color: #FF5733;
            clip-path: none;
          }
          /* Toggle visibility of main menu */
          #menu-toggle-flex:checked ~ #main-menu-flex {
            display: flex;
          }
        }
        @media (max-width: 570px) {
          #header-flex nav {
            min-width: 150px;
            margin-left: 20px;
          }
          .menu-icon {
            font-size: 20px;
          }
          .hamburger-icon {
            margin-left: 10px;
          }
        }
        // Menu toggle styles
        .menu-toggle,
        .menu-icon {
        display: none;
        }
        </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
    </header>
    <!-- Flexbox-based Header -->
    <header id="header-flex">
        <h1 id="logo-flex" aria-label="Continuous Good"></h1>
        <nav>
          <input type="checkbox" id="menu-toggle-flex" class="menu-toggle" />
          <label for="menu-toggle-flex" class="menu-icon">
            Menu
            <span class="hamburger-icon"></span>
          </label>
          <ul id="main-menu-flex">
            <li><a href="#">Give Forward</a></li>
            <li><a href="#">Explore</a></li>
            <li><a href="#">Charities</a></li>
            <li><a href="#">About Us</a></li>
          </ul>
        </nav>
      </header>
    <main>
        <section id="home">
            <h2>Home</h2>
            <p>This is the home section.</p>
        </section>
        <section id="about">
            <h2>About</h2>
            <p>This is the about section.</p>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <p>This is the contact section.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 My Website</p>
    </footer>
</body>
</html>
