<svg width="161" height="100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="red"/>
            <rect x="20" width="20" height="20" fill="blue"/>
            <rect y="20" width="20" height="20" fill="yellow"/>
            <rect x="20" y="20" width="20" height="20" fill="green"/>
        </pattern>
    </defs>
    <rect width="161" height="100" fill="url(#grid)"/>
    <rect x="10" y="35" width="70" height="30" fill="white"/>
    <text x="10" y="50%" dominant-baseline="middle" text-anchor="start" font-size="20" fill="black" style="text-transform: uppercase; font-weight: bold;">LOREM</text>
</svg>